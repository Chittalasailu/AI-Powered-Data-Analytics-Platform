[pytest]
# Lets `pytest` (run from anywhere under the repo) import `src.*` without
# needing an installed package or a manual sys.path hack in every test file --
# conftest.py still does its own sys.path insert too, matching the rest of
# this codebase's convention, so tests keep working even under a pytest
# version/config that ignores this option.
pythonpath = .

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -ra --strict-markers --strict-config

filterwarnings =
    ignore::DeprecationWarning:pyspark.*
    ignore::UserWarning:pyspark.*
